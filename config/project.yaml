# Project-wide settings: paths, modes, stage policy and domain methodology parameters.
# Changes here affect every teammate -> pull request with review (see docs/team_workflow.md).

project:
  name: Catalonia Grid-Scale BESS Opportunity Map
  analysis_crs: EPSG:25831        # ETRS89 / UTM 31N - all metric spatial operations
  geographic_crs: EPSG:4326       # WGS84 lon/lat - exchange / web maps
  # Generous Catalonia bounding box [min_lon, min_lat, max_lon, max_lat] (EPSG:4326).
  # Used ONLY for coordinate plausibility checks, never for analysis.
  region_bbox_wgs84: [0.10, 40.45, 3.40, 42.95]

# Synthetic and real data never share a directory.
modes:
  demo:
    raw_root: data/sample             # synthetic inputs, generated by bess_catalonia.demo
    processed_root: results/demo/processed
    results_root: results/demo
  real:
    raw_root: data/raw                # immutable official source files (not in git)
    processed_root: data/processed
    results_root: results/real

logs_dir: logs
manifests_dir: data/manifests

# During `--all`, these stages are skipped (and reported) when their input data is not yet
# available. Stages not listed here are required: missing data is an error.
# Stages requested explicitly with `--steps` are always required.
optional_stages_in_all: [demand, congestion, renewables, gis, ml]

grid:
  # node_id = "<operator>-<source_node_id>" (upper-case, non-alphanumerics -> "_").
  default_operator: REE
  # Headroom proxy min(generation, demand) is computed only when both values are present,
  # non-negative and (if capacity dates are supplied) published for the same date.
  require_same_capacity_date: true

congestion:
  # Matching order: explicit crosswalk -> identical source id -> unique normalised name.
  allow_id_match: true
  allow_name_match: true
  # Tokens removed before name comparison (after upper-casing and accent removal).
  name_strip_tokens: ["SE", "SUBESTACION", "SUBESTACIO", "ST", "SET"]
  # 12-month ERNI window ends at this month (YYYY-MM). null = latest month in the data.
  reference_period_end: null

integration:
  # Spatial aggregation radius (km) for renewables and municipal demand around each node.
  aggregation_radius_km: 10
