[project]
name = "bess-opportunity-map-ddc"
version = "0.1.0"
description = "GIS opportunity-screening framework for grid-scale BESS in Catalonia (UPC Data-Driven Challenges 2026-27)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyogrio>=0.9",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "folium>=0.17",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.scripts]
bess-opportunity-map-ddc = "bess_catalonia.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "jupyterlab>=4",
    "ipykernel>=6",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bess_catalonia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["slow: end-to-end tests (full demo pipeline, notebooks)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
